# Continuwuity (conduwuit's maintained successor) — bundled-mode homeserver.
# Mounted read-only at /etc/continuwuity/conduwuit.toml (see
# deploy/docker-compose.yml); deployment-specific values (server_name,
# registration token) are overridden by CONTINUWUITY_* env vars set in compose
# — env always wins over this file (continuwuity's documented priority order).
# Defaults below are the safe baseline for a single-user, non-federated server.

[global]

# Matrix server name (user ids become @user:<server_name>). Overridden by
# CONTINUWUITY_SERVER_NAME in compose; keep it the host part of
# HOMESERVER_PUBLIC_URL so Element's display matches.
server_name = "localhost"

# Listen on every interface inside the compose network; exposure to the host
# is controlled by the ports mapping (loopback by default, never 0.0.0.0).
port = 8008
address = "0.0.0.0"

# Database lives in the homeserver-data volume.
database_path = "/var/lib/continuwuity"

# Registration requires a registration token (UIAA m.login.registration_token).
# The token is injected via CONTINUWUITY_REGISTRATION_TOKEN — open registration
# would additionally require a special compile-time feature flag, so a token is
# the only sane path (and 8008 is loopback-bound anyway). Both bundled accounts
# (bot + human) are created by deploy/bootstrap with this token.
allow_registration = true
force_disable_first_run_mode = true

# Single-user self-hosted deployment: no federation, ever.
allow_federation = false
trusted_servers = []

# Room key/turn settings at defaults; media under the same volume.
